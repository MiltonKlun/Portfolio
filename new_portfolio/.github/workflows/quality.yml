name: Portfolio quality

# Active when new_portfolio is a repository root. For this monorepo, install
# a root dispatcher with working-directory: new_portfolio. See README.md.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build
      - run: npm test
      - name: Start preview and enforce Lighthouse budgets
        shell: pwsh
        run: |
          $previewProcess = Start-Process node -ArgumentList 'scripts/preview.mjs' -WindowStyle Hidden -PassThru
          try {
            $previewReady = $false
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              try { Invoke-WebRequest http://127.0.0.1:5174 -UseBasicParsing | Out-Null; $previewReady = $true; break } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $previewReady) { throw 'Preview did not start' }
            npm run test:performance
            $auditExitCode = $LASTEXITCODE
          } finally { Stop-Process -Id $previewProcess.Id -ErrorAction SilentlyContinue }
          exit $auditExitCode
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-quality-evidence
          path: |
            playwright-report/
            test-results/
            reports/
          retention-days: 14
